<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0d0f"/>
      <stop offset="100%" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dcc33"/>
      <stop offset="100%" stop-color="#3fa9f5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 46px "Segoe UI", Verdana, sans-serif; fill: #f5f6f7; }
      .subtitle { font: 400 20px "Segoe UI", Verdana, sans-serif; fill: #9aa0a6; }
      .tag { font: 700 13px "Segoe UI", Verdana, sans-serif; fill: #0c0d0f; }
    </style>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="260" rx="18"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- animated light sweep (SMIL - animates reliably even when this SVG is loaded as a plain <img>) -->
  <g clip-path="url(#clip)">
    <rect x="-80" y="0" width="80" height="260" fill="url(#accent)" opacity="0.12" transform="skewX(-20)">
      <animate attributeName="x" values="-80;1200;1200" keyTimes="0;0.85;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="none" stroke="#2a2d31" stroke-width="1"/>

  <!-- coin icon -->
  <g transform="translate(90,130)">
    <animateTransform attributeName="transform" type="translate" values="90,130; 90,124; 90,130" dur="3s" repeatCount="indefinite" additive="replace"/>
    <circle r="46" fill="#0c0d0f" stroke="url(#accent)" stroke-width="5"/>
    <text x="0" y="16" text-anchor="middle" font="700 44px Verdana" fill="url(#accent)">$</text>
    <circle cx="40" cy="-38" r="6" fill="#7dcc33" filter="url(#glow)">
      <animate attributeName="r" values="5.5;9;5.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="180" y="112" class="title">Production Direct Sell</text>
  <text x="180" y="146" class="subtitle">Sell your production's stock without ever hitching a trailer</text>

  <g transform="translate(180,172)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="url(#accent)"/>
    <text x="75" y="19" text-anchor="middle" class="tag">FS25 · v1.0.0.1</text>
    <rect x="164" y="0" width="168" height="28" rx="14" fill="#1c1f22" stroke="#2a2d31"/>
    <text x="248" y="19" text-anchor="middle" class="tag" fill="#f5f6f7">Multiplayer Ready</text>
    <rect x="346" y="0" width="150" height="28" rx="14" fill="#1c1f22" stroke="#2a2d31"/>
    <text x="421" y="19" text-anchor="middle" class="tag" fill="#f5f6f7">Manual Only</text>
  </g>
</svg>
